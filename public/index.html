// ===== SESSION MANAGEMENT =====
// supabase-js warns against awaiting other Supabase calls inside this callback
// (it can deadlock on the auth lock), so the real work runs on the next tick.
// SIGNED_IN also fires on tab refocus and TOKEN_REFRESHED every hour; those
// only refresh the user object instead of re-initialising the app.
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'INITIAL_SESSION') return;
  const user = session?.user || null;
  if (user && currentUser?.id === user.id) { currentUser = user; return; }
  setTimeout(() => {
    // handleSignOut or the startup restore may have handled it already.
    if ((user?.id ?? null) === (currentUser?.id ?? null)) return;
    onSessionChanged(user);
  }, 0);
});

async function onSessionChanged(user) {
  currentUser = user;
  if (user) {
    await loadProfile();
    updateHeader();
    closeAuthModal();
    startUserFeatures();
    if (pendingAction) { const action = pendingAction; pendingAction = null; action(); }
    else if (document.getElementById('view-detail').classList.contains('active') && currentTask) openTask(currentTask.id);
  } else {
    currentProfile = null;
    stopUserFeatures();
    updateHeader();
    showView('home');
  }
}

// Things that only exist for a signed-in user: notifications, unread badge, live updates.
// Realtime does the live work; the periodic and on-focus sync is a backstop in
// case the channel silently stops delivering (seen once in E2E, cause unknown).
let userSyncTimer = null;

function syncUserState() {
  if (!currentUser) return;
  loadNotifications();
  refreshUnreadBadge();
  // A client-side socket disconnect closes channels without calling their status
  // callback, so the retry in subscribeRealtime never fires; rejoin from here.
  if (realtimeChannel && ['closed', 'errored'].includes(realtimeChannel.state)) {
    console.warn('Realtime channel', realtimeChannel.state, '- resubscribing');
    subscribeRealtime();
  }
}

function startUserFeatures() {
  syncUserState();
  subscribeRealtime();
  clearInterval(userSyncTimer);
  userSyncTimer = setInterval(syncUserState, 60000);
}

function stopUserFeatures() {
  clearInterval(userSyncTimer);
  unsubscribeRealtime();
  notifCache = [];
  updateNotifBadge();
  document.getElementById('notif-panel').classList.remove('open');
  ['msg-badge', 'msg-badge-side'].forEach(id => {
    const badge = document.getElementById(id);
    if (badge) badge.style.display = 'none';
  });
}

// Own row including private columns (email, wallet). The profiles table only
// exposes public columns to the browser.
async function loadProfile() {
  if(!currentUser) return;
  const { data } = await sb.rpc('get_my_profile');
  currentProfile = data && data.id ? data : null;
  if(currentProfile) {
    const avatar = document.querySelector('#header-user-btns .profile-avatar-sm');
    if(avatar) avatar.textContent = getInitials(currentProfile.full_name);
  }
}

// ===== RENDER HELPERS =====
function getInitials(name) {
  if(!name) return '?';
  return name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0,2);
}

function getColor(id) {
  if(!id) return colors[0];
  let hash = 0;
  for(let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

function getTrust(level) { return TRUST_MAP[level] || TRUST_MAP['new']; }

function renderAvatar(id, name, size, fontSize, trust) {
  const ring = trust === TRUST_MAP['premium'] ? '<span class="premium-ring"></span>' : '';
  const dims = size ? `width:${size}px;height:${size}px;font-size:${fontSize}px;` : '';
  return `<div class="avatar" style="background:${getColor(id)};${dims}">${ring}${esc(getInitials(name))}</div>`;
}

function renderStars(r) {
  r = parseFloat(r) || 0;
  const full = Math.floor(r);
  let s = '';
  for(let i=0;i<full;i++) s+='★';
  if(r % 1 >= 0.5) s+='★';
  return `<span class="stars">${s}</span> <span style="color:var(--text-muted)">${r.toFixed(1)}</span>`;
}

function renderTrustBadge(trust) {
  if(!trust) return '';
  return `<span class="trust-badge ${trust.badge}">${t(trust.key)}</span>`;
}

function renderTrustDots(trust) {
  if(!trust) return '';
  let dots = '';
  for(let i=0;i<5;i++) {
    const cls = i < trust.dots ? (trust.dots >= 5 ? 'filled gold' : 'filled') : '';
    dots += `<span class="level-dot ${cls}"></span>`;
  }
  return `<div class="trust-level"><div class="level-bar">${dots}</div></div>`;
}

function payLabel(method) {
  return method === 'escrow' ? '🔒 ' + t('pay_escrow') : '💵 ' + t('pay_cash');
}

function renderPayBadge(method) {
  return `<span class="bidding-badge ${method === 'escrow' ? 'escrow-badge' : 'cash-badge'}">${payLabel(method)}</span>`;
}

function renderStatusBadge(status) {
  return `<span class="status-badge ${status.replace('_', '-')}">${t('status_' + status)}</span>`;
}

function money(n) {
  return '€' + (parseFloat(n) || 0).toFixed(0);
}

function isEnded(endDate) {
  return !endDate || new Date(endDate) <= new Date();
}

function timeLeft(endDate) {
  const diff = new Date(endDate) - new Date();
  if(!endDate || diff <= 0) return t('ended');
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if(h >= 24) return Math.floor(h/24) + t('u_d') + ' ' + (h%24) + t('u_h');
  if(h > 0) return h + t('u_h') + ' ' + m + t('u_m');
  return m + t('u_m');
}

// Green countdown when more than 2 hours are left, red otherwise.
function urgencyClass(endDate) {
  return (new Date(endDate) - new Date()) > 2 * 3600000 ? 'ok' : '';
}

function formatDate(d) {
  const date = new Date(d);
  const diff = new Date() - date;
  if(diff < 60000) return t('just_now');
  if(diff < 3600000) return fill(t('min_ago'), { n: Math.floor(diff/60000) });
  if(diff < 86400000) return date.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
  if(diff < 172800000) return t('yesterday');
  return date.toLocaleDateString(locale(), { day:'numeric', month:'short' });
}

function photoUrl(path) {
  return sb.storage.from('task-photos').getPublicUrl(path).data.publicUrl;
}

// Two-step confirm for destructive buttons: first tap arms, second tap acts.
function confirmTap(btn, action) {
  if (btn.dataset.armed) {
    delete btn.dataset.armed;
    action();
    return;
  }
  const original = btn.textContent;
  btn.dataset.armed = '1';
  btn.textContent = t('tap_again');
  setTimeout(() => {
    if (btn.isConnected && btn.dataset.armed) {
      delete btn.dataset.armed;
      btn.textContent = original;
    }
  }, 3000);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

// ===== RENDER TASK CARDS =====
let homeTasksLoadedAt = 0;

async function ensureHomeTasks() {
  // Re-fetch after a minute so ended tasks drop out and new ones appear.
  if (homeTasksCache && Date.now() - homeTasksLoadedAt > 60000) invalidateHomeTasks();
  if (homeTasksCache) return homeTasksCache;
  if (!homeTasksLoad) {
    const nowIso = new Date().toISOString();
    homeTasksLoad = sb.from('tasks')
      .select('*, poster:profiles!poster_id(id, full_name, avatar_url, rating_avg, rating_count, trust_level)')
      .eq('status', 'open')
      .gt('bidding_ends_at', nowIso)
      .order('created_at', { ascending: false })
      .limit(60)
      .then(({ data, error }) => {
        if (error) {
          homeTasksLoad = null;
          throw error;
        }
        homeTasksCache = data || [];
        homeTasksLoadedAt = Date.now();
        return homeTasksCache;
      });
  }
  return homeTasksLoad;
}

async function renderTaskCards({ fresh = false } = {}) {
  const grid = document.getElementById('tasks-grid');
  if (fresh) invalidateHomeTasks();
  if (!homeTasksCache && !grid.querySelector('.task-card')) {
    grid.innerHTML = `<div class="loading-spinner">${t('loading_tasks')}</div>`;
  }

  let tasks;
  try {
    tasks = await ensureHomeTasks();
  } catch (e) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">😕</div><p>${t('could_not_load')}</p></div>`;
    return;
  }

  if(tasks.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>${t('no_tasks')}</p></div>`;
    document.getElementById('task-count').textContent = countLabel(0, 'task_one', 'tasks_word');
    return;
  }

  const activeCat = document.querySelector('.cat-chip.active');
  const catSlug = activeCat?.dataset.cat || 'all';

  // Apply all filters
  let filtered = tasks;
  if (catSlug !== 'all') {
    filtered = filtered.filter(task => task.category === catSlug);
  }

  // Keyword search
  const keyword = (document.getElementById('search-keyword')?.value || '').toLowerCase().trim();
  if (keyword) {
    filtered = filtered.filter(task =>
      (task.title && task.title.toLowerCase().includes(keyword)) ||
      (task.description && task.description.toLowerCase().includes(keyword)) ||
      (task.location && task.location.toLowerCase().includes(keyword))
    );
  }

  // Neighborhood filter
  if (selectedNeighborhoods.length > 0) {
    filtered = filtered.filter(task => {
      if (!task.location) return false;
      return selectedNeighborhoods.some(n => task.location.includes(n));
    });
  }

  // Time remaining filter
  const timeFilter = document.getElementById('filter-time')?.value;
  if (timeFilter) {
    const hoursLeft = parseInt(timeFilter);
    const cutoff = new Date(Date.now() + hoursLeft * 60 * 60 * 1000);
    filtered = filtered.filter(task => {
      if (!task.bidding_ends_at) return false;
      const ends = new Date(task.bidding_ends_at);
      return ends > new Date() && ends <= cutoff;
    });
  }

  const sort = document.getElementById('sort-tasks')?.value || 'newest';
  filtered = [...filtered];
  if (sort === 'price_low') filtered.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
  else if (sort === 'price_high') filtered.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
  else if (sort === 'ending') filtered.sort((a, b) => new Date(a.bidding_ends_at) - new Date(b.bidding_ends_at));
  else filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  // Update task count text
  let countParts = [];
  if (selectedNeighborhoods.length > 0) {
    const names = selectedNeighborhoods.length <= 2 ? selectedNeighborhoods.join(', ') : selectedNeighborhoods.slice(0, 2).join(', ') + ' +' + (selectedNeighborhoods.length - 2);
    countParts.push(names);
  }
  if (keyword) countParts.push('"' + keyword + '"');
  if (timeFilter) countParts.push(timeFilter + t('u_h'));
  const countSuffix = countParts.length ? ' · ' + countParts.join(' · ') : ' ' + t('tasks_nearby');
  document.getElementById('task-count').textContent = countLabel(filtered.length, 'task_one', 'tasks_word') + countSuffix;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>${t('no_tasks_found')}</p></div>`;
    return;
  }

  let html = '';

  filtered.forEach((task, idx) => {
    if(idx > 0 && idx % 3 === 0) {
      const ad = mockAds[(idx/3 - 1) % mockAds.length];
      html += `<div class="ad-banner"><span class="ad-tag">${t('sponsored')}</span><div class="ad-icon" style="background:${ad.bg}">${ad.icon}</div><div class="ad-content"><h4>${esc(ad.title)}</h4><p>${esc(ad.desc[currentLang] || ad.desc.bg)}</p></div></div>`;
    }

    const poster = task.poster || {};
    const trust = getTrust(poster.trust_level);
    const place = task.location ? task.location.split(',')[0] : '';
    const thumb = task.photos?.length ? `<img class="task-thumb" src="${esc(photoUrl(task.photos[0]))}" alt="" loading="lazy" onerror="this.remove()">` : '';

    html += `
      <div class="task-card" onclick="openTask('${task.id}')">
        ${thumb}
        <div class="task-card-top">
          <span class="task-cat-tag">${esc(getCAT(task.category))}</span>
          <div class="task-price-wrap">
            <div class="task-price">${money(task.price)}</div>
            <div class="task-payment-type">${payLabel(task.payment_method)}</div>
          </div>
        </div>
        <h3>${esc(task.title)}</h3>
        <p class="desc">${esc(task.description)}</p>
        <div class="task-card-footer">
          <div class="task-poster">
            ${renderAvatar(poster.id, poster.full_name, 0, 0, trust)}
            <div class="poster-info">
              <div class="name">${esc(poster.full_name || t('user'))} ${renderTrustBadge(trust)}</div>
              <div class="rating">${renderStars(poster.rating_avg)}</div>
            </div>
          </div>
          <div class="task-meta">
            ${place ? `<span class="task-location-tag">📍 ${esc(place)}</span>` : ''}
            <span class="meta-item"><span class="countdown ${urgencyClass(task.bidding_ends_at)}"><span class="dot"></span> ${esc(timeLeft(task.bidding_ends_at))}</span></span>
            <span class="meta-item">${countLabel(task.bid_count || 0, 'bid_one', 'bids')}</span>
          </div>
        </div>
      </div>`;
  });

  grid.innerHTML = html;
}

// ===== TASK DETAIL =====
function renderBidStatus(status) {
  const cls = { pending: 'pending', selected: 'selected', rejected: 'not-selected', withdrawn: 'withdrawn' }[status] || 'pending';
  return `<span class="status-badge ${cls}">${t('bid_' + status)}</span>`;
}

async function openTask(id) {
  if (!id) return;
  const seq = navSeq;
  const { data: task, error } = await sb.from('tasks')
    .select('*, poster:profiles!poster_id(id, full_name, avatar_url, rating_avg, rating_count, trust_level, tasks_completed), doer:profiles!selected_doer_id(id, full_name)')
    .eq('id', id).single();
  if (seq !== navSeq) return; // user went elsewhere while this loaded
  if(error || !task) return showToast(t('task_not_found'));
  currentTask = task;

  const me = currentUser?.id;
  const poster = task.poster || {};
  const trust = getTrust(poster.trust_level);
  const isOwner = Boolean(me) && task.poster_id === me;
  const isDoer = Boolean(me) && task.selected_doer_id === me;
  const biddingOpen = task.status === 'open' && !isEnded(task.bidding_ends_at);

  document.getElementById('detail-content').innerHTML = `
    <span class="detail-cat-badge">${esc(getCAT(task.category))}</span>
    ${task.status !== 'open' ? `<span style="margin-left:6px">${renderStatusBadge(task.status)}</span>` : ''}
    <h1>${esc(task.title)}</h1>
    <div class="detail-price-row">
      <span class="detail-price">${money(task.price)}</span>
      <span class="bidding-badge ${task.bidding_type==='price'?'price-bid':'fixed-price'}">${task.bidding_type==='price'?t('price_bidding'):t('fixed_price')}</span>
      ${renderPayBadge(task.payment_method)}
    </div>`;

  const payInfo = task.payment_method === 'escrow'
    ? `<div class="payment-info-box"><div class="pay-icon escrow-icon">🔒</div><div class="pay-details"><h5>${t('escrow_protected')}</h5><p>${t('escrow_desc')}</p></div></div>`
    : `<div class="payment-info-box"><div class="pay-icon cash-icon">💵</div><div class="pay-details"><h5>${t('cash_payment')}</h5><p>${t('cash_desc')}</p></div></div>`;

  // Countdown while bidding (or choosing a doer); afterwards just the status.
  const countdownTo = task.status === 'open' ? task.bidding_ends_at : task.status === 'selecting' ? task.selection_ends_at : null;
  const timeCell = countdownTo
    ? `<span class="countdown ${urgencyClass(countdownTo)}"><span class="dot"></span> ${esc(timeLeft(countdownTo))}</span>`
    : esc(t('status_' + task.status));

  const photos = (task.photos || []).map(p => {
    const url = esc(photoUrl(p));
    return `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="" loading="lazy" onerror="this.parentElement.remove()"></a>`;
  }).join('');

  document.getElementById('detail-body').innerHTML = `
    <p class="detail-desc">${esc(task.description)}</p>
    ${photos ? `<div class="detail-photos">${photos}</div>` : ''}
    <div id="detail-status"></div>
    ${payInfo}
    <div class="detail-info-grid">
      <div class="info-card"><div class="label">${t('time_left')}</div><div class="value">${timeCell}</div></div>
      <div class="info-card"><div class="label">${t('location_label')}</div><div class="value">${esc(task.location || t('not_specified'))}</div></div>
      <div class="info-card"><div class="label">${t('total_bids')}</div><div class="value">${countLabel(task.bid_count || 0, 'bid_one', 'bids')}</div></div>
      <div class="info-card"><div class="label">${t('bidding_type_label')}</div><div class="value">${task.bidding_type==='price'?t('open_bidding'):t('fixed_price')}</div></div>
    </div>
    <div class="detail-poster-card">
      ${renderAvatar(poster.id, poster.full_name, 40, 15, trust)}
      <div class="info">
        <h4>${esc(poster.full_name || t('user'))} ${renderTrustBadge(trust)}</h4>
        <div class="rating">${renderStars(poster.rating_avg)}</div>
        <div class="tasks-done">${poster.tasks_completed || 0} ${t('tasks_completed')} ${renderTrustDots(trust)}</div>
      </div>
    </div>
    <div class="detail-actions" id="detail-actions"></div>`;

  // The database only returns bids to the poster (all) and to bidders (their own).
  let bids = [];
  if (me) {
    const { data } = await sb.from('bids')
      .select('*, bidder:profiles!bidder_id(id, full_name, avatar_url, rating_avg, rating_count, trust_level)')
      .eq('task_id', id).order('created_at', { ascending: true });
    bids = (data || []).filter(b => b.status !== 'withdrawn' || b.bidder_id === me);
    if (seq !== navSeq) return;
  }
  const myBid = bids.find(b => b.bidder_id === me);
  const canSelect = isOwner && ['open', 'selecting'].includes(task.status);

  const bidsSection = document.getElementById('bids-section');
  if (bids.length > 0) {
    const heading = isOwner ? `${t('bids_label')} (${bids.length})` : t('your_bid');
    bidsSection.innerHTML = `<h3>${heading}</h3>` + bids.map(b => {
      const bt = getTrust(b.bidder?.trust_level);
      const name = b.bidder?.full_name || t('user');
      return `<div class="bid-card">
        ${renderAvatar(b.bidder?.id, name, 36, 13, bt)}
        <div class="bid-info">
          <div class="bid-header"><span class="name">${esc(name)} ${renderTrustBadge(bt)}</span><span class="bid-price">${money(b.amount || task.price)}</span></div>
          <div class="rating">${renderStars(b.bidder?.rating_avg)} ${renderTrustDots(bt)}</div>
          <div class="bid-msg">${esc(b.message || '')}</div>
          ${b.status !== 'pending' ? `<div style="margin-top:6px">${renderBidStatus(b.status)}</div>` : ''}
          ${canSelect && b.status === 'pending' ? `<button class="select-bid-btn" onclick="selectBid('${b.id}', event)">${t('select_bidder')} ${esc(name.split(' ')[0])}</button>` : ''}
        </div>
      </div>`;
    }).join('');
  } else if (!task.bid_count) {
    bidsSection.innerHTML = `<h3>${t('bids_label')}</h3><div class="empty-state"><div class="icon">🤷</div><p>${t('no_bids_yet')}</p></div>`;
  } else {
    bidsSection.innerHTML = '';
  }

  await renderDetailActions(task, { isOwner, isDoer, myBid });
  if (seq !== navSeq) return;

  document.getElementById('bid-sticky').style.display = (biddingOpen && !isOwner && !myBid) ? 'block' : 'none';
  if (!document.getElementById('view-detail').classList.contains('active')) showView('detail');
}

async function renderDetailActions(task, { isOwner, isDoer, myBid }) {
  const box = document.getElementById('detail-actions');
  const status = document.getElementById('detail-status');
  let html = '';

  if (isOwner && task.status === 'selecting') {
    status.innerHTML = `<div class="status-banner">${esc(fill(t('selecting_banner'), { time: timeLeft(task.selection_ends_at) }))}</div>`;
  }
  if (isOwner && ['open', 'selecting'].includes(task.status)) {
    html += `<button class="btn-danger-outline" onclick="confirmTap(this, () => cancelTask('${task.id}'))">${t('cancel_task')}</button>`;
  }
  if ((isOwner || isDoer) && task.status === 'in_progress') {
    html += `<button class="btn-secondary" onclick="openTaskChat('${task.id}')">💬 ${t('open_chat')}</button>`;
    if (isOwner) html += `<button class="btn-primary" onclick="completeTask('${task.id}', this)">${t('mark_complete')}</button>`;
    if (isDoer) html += `<button class="btn-danger-outline" onclick="confirmTap(this, () => backOutOfTask('${task.id}'))">${t('withdraw_task')}</button>`;
  }
  if ((isOwner || isDoer) && task.status === 'completed') {
    const otherName = isOwner ? task.doer?.full_name : task.poster?.full_name;
    html += (await hasRated(task.id))
      ? `<div class="rated-label">${t('you_rated')}</div>`
      : `<button class="btn-primary" data-name="${esc(otherName || '')}" onclick="openRatingModal('${task.id}', this.dataset.name)">${t('rate_btn')}</button>`;
  }
  if (myBid && myBid.status === 'pending' && ['open', 'selecting'].includes(task.status)) {
    html += `<button class="btn-danger-outline" onclick="confirmTap(this, () => withdrawBid('${myBid.id}'))">${t('withdraw_bid')}</button>`;
  }
  box.innerHTML = html;
}

// Refresh whatever is on screen after a task or bid changed state.
function afterTaskChange(taskId) {
  invalidateHomeTasks();
  loadProfile();
  const active = document.querySelector('.view.active')?.id;
  if (active === 'view-detail' && taskId) openTask(taskId);
  else if (active === 'view-mytasks') renderMyTasks();
}

// ===== MODALS & ACTIONS =====
function openBidModal() {
  if (!requireAuth(() => currentTask && openTask(currentTask.id))) return;
  const modal = document.getElementById('bid-modal');
  const priceGroup = document.getElementById('bid-price-group');
  if(currentTask && currentTask.bidding_type === 'fixed') {
    priceGroup.style.display = 'none';
    document.getElementById('bid-modal-title').textContent = `${t('apply_for')} ${money(currentTask.price)}`;
  } else {
    priceGroup.style.display = 'block';
    document.getElementById('bid-modal-title').textContent = t('bid_modal_title');
  }
  document.getElementById('bid-price-input').value = '';
  document.getElementById('bid-message-input').value = '';
  modal.classList.add('active');
}

function closeBidModal() { document.getElementById('bid-modal').classList.remove('active'); }

async function submitBid() {
  if(!currentTask || !currentUser) return;
  const isFixed = currentTask.bidding_type === 'fixed';
  // Fixed-price bids get the task price from the database.
  const amount = isFixed ? null : parseFloat(document.getElementById('bid-price-input').value);
  const message = document.getElementById('bid-message-input').value.trim();
  if(!isFixed && !(amount > 0 && amount <= 100000)) return showToast(t('please_enter_price'));

  const btn = document.getElementById('btn-submit-bid');
  btn.disabled = true;
  const { error } = await sb.from('bids').insert({
    task_id: currentTask.id,
    bidder_id: currentUser.id,
    amount,
    message: message || null
  });
  btn.disabled = false;

  if(error) {
    if(error.code === '23505') return showToast(t('already_bid'));
    return showToast(errMsg(error));
  }

  closeBidModal();
  showToast(t('bid_submitted'));
  invalidateHomeTasks();
  openTask(currentTask.id);
}

// ===== MY TASKS =====
async function renderMyTasks() {
  if(!currentUser) return;
  const me = currentUser.id;

  const [{ data: posted }, { data: myBids }, rated] = await Promise.all([
    sb.from('tasks').select('*, selected_doer:profiles!selected_doer_id(full_name)').eq('poster_id', me).order('created_at', { ascending: false }),
    sb.from('bids').select('*, task:tasks(id, title, price, category, status, payment_method, poster:profiles!poster_id(full_name))').eq('bidder_id', me).order('created_at', { ascending: false }),
    myRatedTaskIds()
  ]);

  const rateButton = (taskId, name) => rated.has(taskId)
    ? `<div class="mini-actions"><span class="rated-label">${t('you_rated')}</span></div>`
    : `<div class="mini-actions"><button class="mini-btn accent" data-name="${esc(name)}" onclick="event.stopPropagation();openRatingModal('${taskId}', this.dataset.name)">${t('rate_btn')}</button></div>`;

  const postedEl = document.getElementById('posted-tasks');
  if(posted && posted.length > 0) {
    postedEl.innerHTML = posted.map(task => {
      const doerName = task.selected_doer?.full_name || t('user');
      let meta = '';
      if (task.status === 'open') meta = `<span>${countLabel(task.bid_count || 0, 'bid_one', 'bids')} · ${esc(timeLeft(task.bidding_ends_at))} ${t('left')}</span>`;
      else if (task.status === 'selecting') meta = `<span>${countLabel(task.bid_count || 0, 'bid_one', 'bids')}</span>`;
      else if (task.status === 'in_progress') meta = `<span>${t('selected_doer')}: ${esc(doerName)}</span>`;
      else if (task.status === 'completed') meta = `<span>${t('done_by')}: ${esc(doerName)}</span>`;

      let actions = '';
      if (task.status === 'in_progress') actions = `<button class="mark-complete-btn" onclick="event.stopPropagation();completeTask('${task.id}', this)">${t('mark_complete')}</button>`;
      else if (task.status === 'completed') actions = rateButton(task.id, doerName);

      return `<div class="my-task-card" onclick="openTask('${task.id}')">
        <div class="my-task-top"><h4>${esc(task.title)}</h4>${renderStatusBadge(task.status)}</div>
        <div class="my-task-meta">
          <span>${money(task.price)}</span>
          <span>${payLabel(task.payment_method)}</span>
          <span>${esc(getCAT(task.category))}</span>
          ${meta}
        </div>
        ${actions}
      </div>`;
    }).join('');
  } else {
    postedEl.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>${t('no_posted_tasks')}</p></div>`;
  }

  const biddingEl = document.getElementById('bidding-tasks');
  const bidsWithTask = (myBids || []).filter(b => b.task);
  if(bidsWithTask.length > 0) {
    biddingEl.innerHTML = bidsWithTask.map(b => {
      const task = b.task;
      const posterName = task.poster?.full_name || t('user');
      let actions = '';
      if (b.status === 'pending' && ['open', 'selecting'].includes(task.status)) {
        actions = `<div class="mini-actions"><button class="mini-btn" onclick="event.stopPropagation();confirmTap(this, () => withdrawBid('${b.id}'))">${t('withdraw_bid')}</button></div>`;
      } else if (b.status === 'selected' && task.status === 'in_progress') {
        actions = `<div class="mini-actions"><button class="mini-btn accent" onclick="event.stopPropagation();openTaskChat('${task.id}')">💬 ${t('open_chat')}</button></div>`;
      } else if (b.status === 'selected' && task.status === 'completed') {
        actions = rateButton(task.id, posterName);
      }
      const taskClosed = ['cancelled', 'expired'].includes(task.status) && b.status !== 'withdrawn';
      const badge = taskClosed || (b.status === 'selected' && task.status !== 'in_progress')
        ? renderStatusBadge(task.status) : renderBidStatus(b.status);
      return `<div class="my-task-card" onclick="openTask('${task.id}')">
        <div class="my-task-top"><h4>${esc(task.title)}</h4>${badge}</div>
        <div class="my-task-meta">
          <span>${t('your_bid')}: ${money(b.amount || task.price)}</span>
          <span>${t('by')}: ${esc(posterName)}</span>
          <span>${esc(getCAT(task.category))}</span>
        </div>
        ${actions}
      </div>`;
    }).join('');
  } else {
    biddingEl.innerHTML = `<div class="empty-state"><div class="icon">🙋</div><p>${t('no_bidding_tasks')}</p></div>`;
  }
}

// ===== MESSAGES =====
const BACK_ICON = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';

async function renderChats() {
  if(!currentUser) return;
  const me = currentUser.id;
  const chatList = document.getElementById('chat-list');
  chatList.innerHTML = `<div class="loading-spinner">${t('loading')}</div>`;

  const { data: convos } = await sb.from('conversations')
    .select('*, task:tasks(id, title, price, status), poster:profiles!poster_id(id, full_name, avatar_url, trust_level), doer:profiles!doer_id(id, full_name, avatar_url, trust_level)')
    .or(`poster_id.eq.${me},doer_id.eq.${me}`)
    .order('last_message_at', { ascending: false, nullsFirst: false });

  if(!convos || convos.length === 0) {
    chatList.innerHTML = `<div class="empty-state"><div class="icon">💬</div><p>${t('no_messages')}</p></div>`;
    return;
  }

  // One query for recent messages across all conversations instead of two per conversation.
  const { data: msgs } = await sb.from('messages')
    .select('conversation_id, content, created_at, sender_id, is_read')
    .in('conversation_id', convos.map(c => c.id))
    .order('created_at', { ascending: false })
    .limit(500);
  const lastMsg = {};
  const unread = {};
  (msgs || []).forEach(m => {
    if (!lastMsg[m.conversation_id]) lastMsg[m.conversation_id] = m;
    if (m.sender_id !== me && !m.is_read) unread[m.conversation_id] = (unread[m.conversation_id] || 0) + 1;
  });

  chatList.innerHTML = convos.map(c => {
    const other = c.poster_id === me ? c.doer : c.poster;
    const name = other?.full_name || t('user');
    const avatar = renderAvatar(other?.id, name, 44, 15, null);
    if(!c.is_unlocked) {
      return `<div class="chat-item" style="opacity:0.5" data-name="${esc(name)}" data-id="${esc(other?.id || '')}" onclick="openLockedChat(this.dataset.name, this.dataset.id)">
        ${avatar}
        <div class="chat-info"><div class="chat-name">${esc(name)}</div><div class="chat-task">${esc(c.task?.title || t('task'))}</div><div class="chat-preview">${t('waiting_selection')}</div></div>
      </div>`;
    }
    const last = lastMsg[c.id];
    return `<div class="chat-item" onclick="openChat('${c.id}')">
      ${avatar}
      <div class="chat-info"><div class="chat-name">${esc(name)}</div><div class="chat-task">${esc(c.task?.title || t('task'))} · ${money(c.agreed_price || c.task?.price)}</div><div class="chat-preview">${esc(last?.content || t('start_chatting'))}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="chat-time">${last ? formatDate(last.created_at) : ''}</span>
        ${unread[c.id] ? '<span class="unread-dot"></span>' : ''}
      </div>
    </div>`;
  }).join('');
}

function openLockedChat(name, otherId) {
  const conv = document.getElementById('chat-conversation');
  document.getElementById('messages-list-view').style.display = 'none';
  conv.className = 'chat-view active';
  conv.innerHTML = `
    <div class="chat-conv-header">
      <button class="back-btn" onclick="closeChat()">${BACK_ICON} ${t('nav_back')}</button>
      ${renderAvatar(otherId, name, 32, 12, null)}
      <span style="font-weight:600;font-size:14px">${esc(name)}</span>
    </div>
    <div class="locked-chat"><div class="lock-icon">🔒</div><h3>${t('chat_locked')}</h3><p>${t('chat_locked_desc')}</p></div>`;
}

function renderMessageBubble(m) {
  const mine = m.sender_id === currentUser?.id;
  return `<div data-msg-id="${esc(m.id)}"><div class="msg-bubble ${mine ? 'sent' : 'received'}">${esc(m.content)}</div><div class="msg-time ${mine ? '' : 'left'}">${formatDate(m.created_at)}</div></div>`;
}

function appendMessage(m) {
  const msgs = document.querySelector('#chat-conversation .chat-messages');
  if (!msgs || msgs.querySelector(`[data-msg-id="${CSS.escape(m.id)}"]`)) return;
  msgs.insertAdjacentHTML('beforeend', renderMessageBubble(m));
  msgs.scrollTop = msgs.scrollHeight;
}

async function openChat(convId) {
  currentConvId = convId;
  const { data: conv } = await sb.from('conversations')
    .select('*, task:tasks(id, title, price), poster:profiles!poster_id(id, full_name), doer:profiles!doer_id(id, full_name)')
    .eq('id', convId).single();
  if(!conv) return;

  const other = conv.poster_id === currentUser.id ? conv.doer : conv.poster;
  const name = other?.full_name || t('user');

  const { data: messages } = await sb.from('messages').select('*').eq('conversation_id', convId).order('created_at', { ascending: true });

  // Mark as read
  await sb.from('messages').update({ is_read: true }).eq('conversation_id', convId).neq('sender_id', currentUser.id).eq('is_read', false);
  refreshUnreadBadge();

  const convEl = document.getElementById('chat-conversation');
  document.getElementById('messages-list-view').style.display = 'none';
  convEl.className = 'chat-view active';
  convEl.innerHTML = `
    <div class="chat-conv-header">
      <button class="back-btn" onclick="closeChat()">${BACK_ICON} ${t('nav_back')}</button>
      ${renderAvatar(other?.id, name, 32, 12, null)}
      <span style="font-weight:600;font-size:14px">${esc(name)}</span>
    </div>
    <div class="chat-task-ref" style="cursor:pointer" onclick="openTask('${conv.task_id}')"><span class="task-title">${esc(conv.task?.title || t('task'))}</span><span class="task-price-sm">${money(conv.agreed_price || conv.task?.price)}</span></div>
    <div class="chat-messages">
      ${(messages || []).map(renderMessageBubble).join('')}
    </div>
    <div class="chat-input-bar">
      <input type="text" maxlength="2000" placeholder="${esc(t('type_message'))}" aria-label="${esc(t('type_message'))}" onkeydown="if(event.key==='Enter')sendMessage(this)">
      <button class="send-btn" aria-label="${esc(t('send'))}" onclick="sendMessage(this.previousElementSibling)"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>`;
  const msgsEl = convEl.querySelector('.chat-messages');
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

async function sendMessage(input) {
  const text = input.value.trim();
  if(!text || !currentConvId || !currentUser || input.disabled) return;

  input.disabled = true;
  const { data, error } = await sb.from('messages')
    .insert({ conversation_id: currentConvId, sender_id: currentUser.id, content: text })
    .select().single();
  input.disabled = false;
  if(error) return showToast(t('failed_send'));

  appendMessage(data);
  input.value = '';
  input.focus();
}

function resetChatPane() {
  const pane = document.getElementById('chat-conversation');
  pane.className = 'chat-view';

}

function closeChat() {
  currentConvId = null;

// ===== REALTIME (new notifications + chat messages) =====
let realtimeChannel = null;
let realtimeRetry = null;

function subscribeRealtime() {
  unsubscribeRealtime();
  if (!currentUser) return;
  const uid = currentUser.id;
  // A fresh topic each time, so a new channel never collides with one that is still leaving.
  const channel = sb.channel(`qt-user-${uid}-${Date.now()}`);
  realtimeChannel = channel;
  channel
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${currentUser.id}` }, payload => {
      notifCache.unshift(payload.new);
      updateNotifBadge();
      if (document.getElementById('notif-panel').classList.contains('open')) renderNotifications();
      showToast(notifText(payload.new));
      invalidateHomeTasks();
      const taskId = payload.new.data?.task_id;
      if (taskId && currentTask?.id === taskId && document.getElementById('view-detail').classList.contains('active')) openTask(taskId);
    })
    // RLS limits these to conversations the user is part of.
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const m = payload.new;
      if (m.conversation_id === currentConvId && document.getElementById('chat-conversation').classList.contains('active')) {
        appendMessage(m);
        if (m.sender_id !== currentUser.id) {
          sb.from('messages').update({ is_read: true }).eq('id', m.id).then(() => {});
        }
        return;
      }
      if (m.sender_id !== currentUser.id) {
        refreshUnreadBadge();
        if (document.getElementById('view-messages').classList.contains('active')) renderChats();
      }
    })
    .subscribe((status, err) => {
      if (channel !== realtimeChannel) return; // an old channel we already replaced
      if (status === 'SUBSCRIBED') {
        syncUserState(); // pick up anything that happened before the channel joined
      } else if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status) && currentUser?.id === uid) {
        console.warn('Realtime channel', status, err || '');
        clearTimeout(realtimeRetry);
        realtimeRetry = setTimeout(subscribeRealtime, 5000);
      }
    });
}

function unsubscribeRealtime() {
  clearTimeout(realtimeRetry);
  const channel = realtimeChannel;
  realtimeChannel = null;
  if (channel) sb.removeChannel(channel);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') syncUserState();
});

// Phone photos are large; resize to at most 1600px and re-encode as JPEG before upload.
async function shrinkImage(file, maxSide = 1600) {
  let bitmap;
  try { bitmap = await createImageBitmap(file); } catch { return null; }
  const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close?.();
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.82));
}

// Uploads into the user's own folder (the only place storage policies allow)
// and returns the storage paths saved on the task.
async function uploadPendingPhotos() {
  const bucket = sb.storage.from('task-photos');
  const paths = [];
  for (const p of pendingPhotos) {
    const blob = await shrinkImage(p.file);
    const path = `${currentUser.id}/${crypto.randomUUID()}.jpg`;
    const { error } = blob
      ? await bucket.upload(path, blob, { contentType: 'image/jpeg' })
      : { error: new Error('photo_failed') };
    if (error) {
      if (paths.length) bucket.remove(paths);
      throw error;
    }
    paths.push(path);
  }
  return paths;
}

function readCreateForm() {
  const neighborhood = document.getElementById('create-neighborhood').value;
  const address = document.getElementById('create-address').value.trim();
  return {

function createFormProblem(f) {
  if (!f.title || !f.desc || !f.category || Number.isNaN(f.price)) return t('fill_all_fields');
  if (f.title.length < 3) return t('title_too_short');
  if (!(f.price >= 1 && f.price <= 100000)) return t('invalid_price');
  return null;
}

function previewTask() {
  if (!requireAuth(() => showView('create'))) return;
  const f = readCreateForm();
  const problem = createFormProblem(f);
  if (problem) return showToast(problem);

  const thumb = pendingPhotos[0] ? `<img class="task-thumb" src="${pendingPhotos[0].url}" alt="">` : '';

async function postTask() {
  if (!requireAuth(() => showView('create'))) return;
  const f = readCreateForm();
  const problem = createFormProblem(f);
  if (problem) return showToast(problem);

  const btn = document.getElementById('btn-post-task');
  btn.disabled = true;
  btn.textContent = t('posting');
  try {
    const photos = await uploadPendingPhotos();
    // Status, counters and the bidding deadline are set by the database.
    const { error } = await sb.from('tasks').insert({
      poster_id: currentUser.id,
      title: f.title,
      description: f.desc,
      category: f.category,
      price: f.price,
      bidding_type: createBidType,
      payment_method: createPayMethod,
      location: f.location || null,
      photos,
      bidding_duration_hours: f.duration,
      selection_duration_hours: f.selection,
      bidding_ends_at: new Date(Date.now() + f.duration * 3600000).toISOString()
    });
    if (error) {
      if (photos.length) sb.storage.from('task-photos').remove(photos);
      throw error;
    }
  } catch (e) {
    return showToast(e.message === 'photo_failed' ? t('photo_failed') : errMsg(e));
  } finally {
    btn.disabled = false;
    btn.textContent = t('post_button');
  }

  invalidateHomeTasks();
  loadProfile();
  document.getElementById('preview-card').classList.remove('show');
  ['create-title', 'create-desc', 'create-price', 'create-neighborhood', 'create-address', 'create-cat']
    .forEach(id => { document.getElementById(id).value = ''; });
  pendingPhotos.forEach(p => URL.revokeObjectURL(p.url));
  pendingPhotos = [];
  renderPhotoThumbs();
  showToast(t('task_posted_msg'));
  setTimeout(() => showView('home'), 1200);
}

function buildNeighborhoodList(filter = '') {
  const container = document.getElementById('neighborhood-list');
  let html = '';
  const lf = filter.toLowerCase();

  Object.entries(SOFIA_DISTRICTS).forEach(([district, data]) => {
    const matchingQuarters = data.quarters.filter(q => !lf || q.toLowerCase().includes(lf) || district.toLowerCase().includes(lf));
    if (matchingQuarters.length === 0 && lf) return;
    const quarters = lf ? matchingQuarters : data.quarters;
    const expanded = lf ? true : false;

    html += `<div class="district-group${expanded ? ' expanded' : ''}">
      <div class="district-header" onclick="toggleDistrict(this)">
        <div class="district-dot" style="background:${data.color}"></div>
        <span class="district-name">${district}</span>
        <span class="district-arrow">▼</span>
      </div>
      <div class="district-quarters">`;

    quarters.forEach(q => {
      const checked = tempSelectedNeighborhoods.includes(q) ? 'checked' : '';
      const quarterId = 'q-' + district.replace(/\s+/g, '-') + '-' + q.replace(/\s+/g, '-');
      html += `<div class="quarter-item">
        <input type="checkbox" id="${quarterId}" value="${esc(q)}" ${checked} onchange="toggleQuarter(this)">
        <label for="${quarterId}">${esc(q)}</label>
      </div>`;
    });

    html += `</div></div>`;
  });

  container.innerHTML = html;
}

function toggleDistrict(header) {
  const group = header.parentElement;
  const wasExpanded = group.classList.contains('expanded');
  group.classList.toggle('expanded');

  // If clicking district name, select/deselect all quarters
  if (wasExpanded) return;
}

function toggleQuarter(checkbox) {
  const val = checkbox.value;
  if (checkbox.checked) {
    if (!tempSelectedNeighborhoods.includes(val)) tempSelectedNeighborhoods.push(val);
  } else {
    tempSelectedNeighborhoods = tempSelectedNeighborhoods.filter(n => n !== val);
  }
  updateMapSelection();
}

// Build a lookup: quarter name → district name
const QUARTER_TO_DISTRICT = {};
Object.entries(SOFIA_DISTRICTS).forEach(([district, data]) => {
  data.quarters.forEach(q => { QUARTER_TO_DISTRICT[q] = district; });
});

// Load the real Sofia SVG map into containers
let svgMapCache = null;
async function loadSofiaMap() {
  if (!svgMapCache) {
    try {
      const resp = await fetch('/sofia-map.svg');
      svgMapCache = await resp.text();
    } catch(e) { console.error('Failed to load Sofia map:', e); return; }
  }
  // Insert into both containers
  ['home-map-container', 'modal-map-container'].forEach(id => {
    const el = document.getElementById(id);
    if (el && !el.querySelector('svg')) {
      el.innerHTML = svgMapCache;
      const svg = el.querySelector('svg');
      if (svg) {
        svg.setAttribute('class', 'sofia-map');
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        colorMapQuarters(svg);
        attachMapEvents(svg, id === 'home-map-container' ? 'home' : 'modal');
      }
    }
  });
}

function colorMapQuarters(svg) {
  svg.querySelectorAll('path.quarter').forEach(path => {
    const name = path.getAttribute('data-name');
    const district = QUARTER_TO_DISTRICT[name];
    if (district && SOFIA_DISTRICTS[district]) {
      path.style.fill = SOFIA_DISTRICTS[district].color;
    } else {
      path.style.fill = '#dac1a7';
    }
  });
}

function attachMapEvents(svg, mode) {
  // Tooltip on hover
  const tooltip = document.createElement('div');
  tooltip.className = 'sofia-map-tooltip';
  tooltip.style.display = 'none';
  svg.parentElement.appendChild(tooltip);

  svg.querySelectorAll('path.quarter').forEach(path => {
    path.addEventListener('mouseenter', function(e) {
      const name = this.getAttribute('data-name');
      const district = QUARTER_TO_DISTRICT[name];
      tooltip.textContent = name + (district ? ' (' + district + ')' : '');
      tooltip.style.display = 'block';
    });
    path.addEventListener('mousemove', function(e) {
      const rect = svg.parentElement.getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left) + 'px';
      tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
    });
    path.addEventListener('mouseleave', function() {
      tooltip.style.display = 'none';
    });
    path.addEventListener('click', function() {
      const name = this.getAttribute('data-name');
      if (mode === 'home') {
        toggleQuarterHome(name);
      } else {
        toggleQuarterOnModalMap(name);
      }
    });
  });
}

function toggleQuarterHome(quarterName) {
  if (selectedNeighborhoods.includes(quarterName)) {
    selectedNeighborhoods = selectedNeighborhoods.filter(n => n !== quarterName);
  } else {
    selectedNeighborhoods.push(quarterName);

  updateHomeMapUI();
  updateLocationBarText();

function toggleQuarterOnModalMap(quarterName) {

    { title: 'Инсталация на кухненски шкафове', desc: 'Монтаж на нови шкафове, нужен опитен майстор', category: 'home-repair', price: 250, neighborhood: 'Люлин 5', address: 'ж.к. Люлин 5' },
    { title: 'Транспорт на мебели', desc: 'Преместване на диван и маса, нужен камион', category: 'moving', price: 80, neighborhood: 'Изток', address: 'ж.к. Изток' },
    { title: 'Дизайн на логото', desc: 'Създаване на професионално лого за малък бизнес', category: 'other', price: 200, neighborhood: 'Младост 1', address: '' },
    { title: 'Помощ с уебсайт', desc: 'Поправка на контактна форма и бързината на сайта', category: 'tech-help', price: 150, neighborhood: 'Лозенец', address: '' },
    { title: 'Частни уроци по математика', desc: 'Подготовка на ученик за матура, 3-4 часа седмично', category: 'tutoring', price: 25, neighborhood: 'Борово', address: '' },
    { title: 'Дърводелски услуги', desc: 'Направа на полица и опаковане на мебели', category: 'home-repair', price: 180, neighborhood: 'Слатина', address: '' },
    { title: 'Фотография на събитие', desc: 'Снимане на сватба, 6 часа работа', category: 'other', price: 400, neighborhood: 'Младост 2', address: '' },
    { title: 'SEO оптимизация', desc: 'Подобряване на видимост на малкия е-магазин', category: 'tech-help', price: 300, neighborhood: 'Иван Вазов', address: '' },
    { title: 'Писане на статии', desc: 'Съдържание за блог, 2000+ думи на текст', category: 'other', price: 60, neighborhood: 'Оборище', address: '' },
    { title: 'Уход на тревата', desc: 'Косене, тримиране и озеленяване на градина', category: 'gardening', price: 100, neighborhood: 'Симеоново', address: '' },
    { title: 'Поправка на велосипед', desc: 'Смяна на верига и поправка на спирачки', category: 'home-repair', price: 50, neighborhood: 'Бояна', address: '' },
    { title: 'Вокални уроци онлайн', desc: 'Обучение в пеене, всеки ден освен неделя', category: 'tutoring', price: 30, neighborhood: 'Банишора', address: '' },
    { title: 'Пакетиране и изпращане', desc: 'Подготовка и изпращане на пратки за онлайн продажба', category: 'errands', price: 35, neighborhood: 'Надежда 1', address: '' },
    { title: 'Детайлинг на кола', desc: 'Пълно почистване и восък на автомобил', category: 'other', price: 280, neighborhood: 'Красна поляна 1', address: '' }
  ];

  let created = 0;
  for (const task of dummyTasks) {
    const durationHours = 6;
    const selectionHours = 3;
    const biddingEndsAt = new Date(Date.now() + durationHours * 3600000).toISOString();

    const { error } = await sb.from('tasks').insert({
      poster_id: currentUser.id,
      title: task.title,
      description: task.desc,
      category: task.category,
      price: task.price,
      bidding_type: 'fixed',
      payment_method: 'cash',
      location: task.neighborhood + (task.address ? ', ' + task.address : ''),
      bidding_duration_hours: durationHours,
      selection_duration_hours: selectionHours,
      bidding_ends_at: biddingEndsAt
    });

    if (!error) created++;
  }

  invalidateHomeTasks();
  showToast(created + ' / ' + dummyTasks.length);
  setTimeout(() => { renderTaskCards(); }, 800);
}

// ===== INIT =====
async function initApp() {
  if (!OAUTH_ENABLED) document.querySelectorAll('.oauth-only').forEach(el => el.remove());
  currentLang = localStorage.getItem('qt_lang') || 'bg';
  document.getElementById('lang-toggle').textContent = currentLang === 'bg' ? 'EN' : 'BG';
  applyTranslations();
  updateHeader();
  loadSofiaMap();
  renderTaskCards();
}

// Show the app straight away, then restore the session in the background.
initApp();
(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) await onSessionChanged(session.user);
  } catch (e) {
    console.error('Session restore failed:', e);
  }
})();
</script>
