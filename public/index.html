<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuickTask - Свърши нещата</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0/dist/umd/supabase.js"></script>
<style>
:root {
  --primary: #1a365d;
  --primary-light: #2a4a7f;
  --primary-dark: #0f2440;
  --accent: #0d9488;
  --accent-light: #14b8a6;
  --accent-pale: #ccfbf1;
  --bg: #f1f5f9;
  --bg-warm: #f8fafc;
  --card: #ffffff;
  --text: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --held: #fbbf24;
  --released: #34d399;
  --received: #60a5fa;
  --shadow-sm: 0 1px 3px rgba(15,36,64,0.06);
  --shadow-md: 0 4px 12px rgba(15,36,64,0.08);
  --shadow-lg: 0 8px 30px rgba(15,36,64,0.12);
  --shadow-xl: 0 20px 50px rgba(15,36,64,0.15);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 50%;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.app-frame {
  width: 100%;
  max-width: 100%;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
  overflow: hidden;
  display: none;
}

.app-frame.app-visible {
  display: block;
}

/* Header */
.app-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  width: 100%;
  z-index: 100;
  background: var(--primary);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
}

.app-header .logo {
  font-family: 'Fraunces', serif;
  color: white;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.app-header .logo span { color: var(--accent-light); }

.header-right { display: flex; align-items: center; gap: 12px; }

.lang-toggle-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.4);
  color: white;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: background 0.2s;
}
.lang-toggle-btn:hover { background: rgba(255,255,255,0.1); }

.notif-btn {
  position: relative;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: var(--primary-light);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 18px;
  transition: background 0.2s;
}

.notif-btn:hover { background: var(--primary-dark); }

.notif-badge {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 8px;
  height: 8px;
  background: var(--danger);
  border-radius: var(--radius-full);
  border: 2px solid var(--primary);
}

.profile-avatar-sm {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.3);
}

/* Main content */
.app-content {
  padding-top: 56px;
  padding-bottom: 72px;
  min-height: 100vh;
}

/* Views */
.view { display: none; animation: fadeIn 0.25s ease; }
.view.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Bottom Nav */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  background: white;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: 68px;
  padding-bottom: 4px;
  z-index: 100;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  padding: 6px 12px;
  border: none;
  background: none;
  color: var(--text-muted);
  font-size: 10px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  transition: color 0.2s;
  position: relative;
}

.nav-item.active { color: var(--accent); }
.nav-item .nav-icon { font-size: 22px; }

.nav-item.create-btn .nav-icon {
  width: 44px;
  height: 44px;
  background: var(--accent);
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 24px;
  margin-top: -20px;
  box-shadow: 0 4px 15px rgba(13,148,136,0.4);
  transition: transform 0.2s, box-shadow 0.2s;
}

.nav-item.create-btn:hover .nav-icon {
  transform: scale(1.1);
  box-shadow: 0 6px 20px rgba(13,148,136,0.5);
}

.nav-item.create-btn span:last-child { margin-top: -2px; }

.msg-badge {
  position: absolute;
  top: 2px;
  right: 4px;
  min-width: 16px;
  height: 16px;
  background: var(--danger);
  border-radius: 10px;
  color: white;
  font-size: 9px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

/* ===== AD BANNER ===== */
.ad-banner {
  margin: 8px 16px;
  background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  border: 1px dashed var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}

.ad-banner:hover { box-shadow: var(--shadow-sm); }
.ad-banner { grid-column: 1 / -1; }

.ad-banner .ad-tag {
  position: absolute;
  top: 4px;
  right: 8px;
  font-size: 8px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.ad-banner .ad-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.ad-banner .ad-content h4 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}

.ad-banner .ad-content p {
  font-size: 11.5px;
  color: var(--text-secondary);
  line-height: 1.3;
}

/* ===== TRUST BADGES ===== */
.trust-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
}

.trust-badge.verified { color: var(--accent); background: var(--accent-pale); }
.trust-badge.trusted { color: #7c3aed; background: #ede9fe; }
.trust-badge.premium { color: #b45309; background: #fef3c7; }
.trust-badge.new-user { color: var(--text-muted); background: #f1f5f9; }

.trust-level {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
}

.trust-level .level-bar {
  display: flex;
  gap: 2px;
}

.trust-level .level-dot {
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--border);
}

.trust-level .level-dot.filled { background: var(--accent); }
.trust-level .level-dot.gold { background: var(--warning); }

.trust-level .level-text {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 500;
}

/* ===== PAYMENT MODE TOGGLE ===== */
.payment-mode-bar {
  margin: 0 16px 12px;
  background: white;
  border-radius: var(--radius-md);
  padding: 4px;
  display: flex;
  gap: 4px;
  border: 1px solid var(--border);
}

.payment-mode-btn {
  flex: 1;
  padding: 8px 10px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text-secondary);
  background: transparent;
  transition: all 0.2s;
  text-align: center;
}

.payment-mode-btn.active {
  background: var(--primary);
  color: white;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

/* ===== HOME VIEW ===== */
.search-section {
  padding: 16px;
  background: var(--primary);
  padding-top: 8px;
  padding-bottom: 20px;
  position: relative;
}

.search-section::after {
  content: '';
  position: absolute;
  bottom: -12px;
  left: 0;
  right: 0;
  height: 24px;
  background: var(--primary);
  border-radius: 0 0 24px 24px;
}

.search-bar {
  display: flex;
  align-items: center;
  background: white;
  border-radius: var(--radius-lg);
  padding: 10px 14px;
  gap: 10px;
  box-shadow: var(--shadow-md);
}

.search-bar svg { color: var(--text-muted); flex-shrink: 0; }

.search-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--text);
  background: transparent;
}

.search-bar input::placeholder { color: var(--text-muted); }

.search-filters {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.filter-select {
  padding: 7px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  background: white;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
.filter-select:focus { border-color: var(--accent); }

.location-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.8);
  font-size: 12px;
  margin-bottom: 10px;
  padding-left: 2px;
}

.location-bar svg { width: 14px; height: 14px; }

.categories-scroll {
  padding: 20px 16px 8px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.categories-scroll::-webkit-scrollbar { display: none; }

.cat-chip {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: white;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'DM Sans', sans-serif;
  white-space: nowrap;
}

.cat-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
.cat-chip:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

.sort-bar {
  padding: 4px 16px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sort-bar span { font-size: 13px; color: var(--text-secondary); font-weight: 500; }

.sort-select {
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  color: var(--accent);
  border: none;
  background: transparent;
  font-weight: 600;
  cursor: pointer;
  outline: none;
}

/* Task Cards */
.tasks-grid {
  padding: 0 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.task-card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 14px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  border: 1px solid var(--border);
}

.task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

.task-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.task-cat-tag {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent);
  background: var(--accent-pale);
  padding: 3px 8px;
  border-radius: 6px;
}

.task-price-wrap {
  text-align: right;
}

.task-price {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
}

.task-payment-type {
  font-size: 9px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.task-card h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text);
  line-height: 1.3;
}

.task-card .desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.4;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.task-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.task-poster { display: flex; align-items: center; gap: 8px; }

.avatar {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: white;
  flex-shrink: 0;
  position: relative;
}

.avatar .premium-ring {
  position: absolute;
  inset: -2px;
  border-radius: var(--radius-full);
  border: 2px solid var(--warning);
}

.poster-info .name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 4px;
}

.poster-info .rating { font-size: 11px; color: var(--warning); }

.task-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-muted);
}

.task-meta .meta-item { display: flex; align-items: center; gap: 3px; }

.bidding-badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
}

.bidding-badge.price-bid { background: #fef3c7; color: #92400e; }
.bidding-badge.fixed-price { background: #dbeafe; color: #1e40af; }
.bidding-badge.cash-badge { background: #d1fae5; color: #065f46; }
.bidding-badge.escrow-badge { background: #ede9fe; color: #5b21b6; }

/* ===== TASK DETAIL VIEW ===== */
.detail-header {
  padding: 16px;
  background: white;
  border-bottom: 1px solid var(--border);
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  background: none;
  font-family: 'DM Sans', sans-serif;
  margin-bottom: 12px;
  padding: 4px 0;
}

.detail-cat-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-pale);
  padding: 4px 10px;
  border-radius: 6px;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.detail-header h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.3;
}

.detail-price-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.detail-price {
  font-family: 'Fraunces', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--primary);
}

.detail-body { padding: 16px; }

.detail-desc {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-secondary);
  margin-bottom: 16px;
}

.detail-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.info-card {
  background: white;
  border-radius: var(--radius-md);
  padding: 12px;
  border: 1px solid var(--border);
}

.info-card .label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.info-card .value { font-size: 14px; font-weight: 600; color: var(--text); }

.detail-poster-card {
  background: white;
  border-radius: var(--radius-md);
  padding: 14px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.detail-poster-card .avatar { width: 40px; height: 40px; font-size: 15px; }

.detail-poster-card .info h4 {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.detail-poster-card .info .rating { font-size: 12px; color: var(--warning); }
.detail-poster-card .info .tasks-done { font-size: 11px; color: var(--text-muted); }

/* Payment info box in detail */
.payment-info-box {
  background: white;
  border-radius: var(--radius-md);
  padding: 12px 14px;
  border: 1px solid var(--border);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.payment-info-box .pay-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.payment-info-box .pay-icon.cash-icon { background: #d1fae5; }
.payment-info-box .pay-icon.escrow-icon { background: #ede9fe; }

.payment-info-box .pay-details h5 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.payment-info-box .pay-details p {
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.3;
}

/* Bids section */
.bids-section { padding: 0 16px 16px; }

.bids-section h3 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text);
}

.bid-card {
  background: white;
  border-radius: var(--radius-md);
  padding: 12px;
  border: 1px solid var(--border);
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.bid-card .avatar { width: 36px; height: 36px; font-size: 13px; margin-top: 2px; }
.bid-info { flex: 1; }

.bid-info .bid-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}

.bid-info .name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px; }

.bid-info .bid-price {
  font-family: 'Fraunces', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
}

.bid-info .rating { font-size: 11px; color: var(--warning); margin-bottom: 4px; }

.bid-info .bid-msg {
  font-size: 12.5px;
  color: var(--text-secondary);
  line-height: 1.4;
}

.select-bid-btn {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: white;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 6px;
  transition: background 0.2s;
}

.select-bid-btn:hover { background: var(--accent-light); }

.place-bid-sticky {
  position: fixed;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 600px;
  z-index: 50;
}

.place-bid-btn {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius-lg);
  background: var(--accent);
  color: white;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(13,148,136,0.4);
  transition: transform 0.2s;
}

.place-bid-btn:hover { transform: scale(1.02); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,36,64,0.5);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-overlay.active { display: flex; }

/* Auth modal overlay (on-demand, not full-page gate) */

  background: rgba(15,36,64,0.55);

  justify-content: center;
  padding: 20px;
}

.auth-modal-close {

  right: 12px;
  width: 32px;
  height: 32px;
  border: none;
  background: rgba(0,0,0,0.06);
  color: var(--text-muted);
  border-radius: 50%;
  font-size: 16px;
  line-height: 1;
  cursor: pointer;

  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.auth-modal-close:hover { background: rgba(0,0,0,0.12); }

/* Header buttons: logged-out state */
.header-auth-btns { display: flex; gap: 8px; align-items: center; }
.btn-header-login {
  padding: 6px 14px;
  background: none;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
}
.btn-header-login:hover { border-color: var(--accent); color: var(--accent); }
.btn-header-signup {
  padding: 6px 14px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius-md);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: white;

  transition: background 0.2s;
}
.btn-header-signup:hover { background: var(--accent-light); }

.modal {
  width: 100%;
  max-width: 100%;
  background: white;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: 24px 20px 32px;

}

.modal h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--text);
}

.modal-close {
  float: right;
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--text-muted);
  padding: 4px;
}

/* Form elements */
.form-group { margin-bottom: 16px; }

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--text);
  background: white;
  outline: none;
  transition: border-color 0.2s;
}

.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-select option { background: white; color: var(--text); }

.btn-primary {
  width: 100%;
  padding: 13px;
  border-radius: var(--radius-md);
  background: var(--accent);
  color: white;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}

.btn-primary:hover { background: var(--accent-light); transform: scale(1.01); }

.btn-secondary {
  width: 100%;
  padding: 13px;
  border-radius: var(--radius-md);
  background: white;
  color: var(--primary);
  border: 1.5px solid var(--border);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.2s;
}

.btn-secondary:hover { border-color: var(--primary); }

/* Toggle */
.toggle-group {
  display: flex;
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 3px;
  gap: 3px;
}

.toggle-opt {
  flex: 1;
  padding: 9px 10px;
  border: none;
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text-secondary);
  background: transparent;
  transition: all 0.2s;
  text-align: center;
}

.toggle-opt.active {
  background: white;
  color: var(--primary);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

/* ===== CREATE TASK VIEW ===== */
.create-view { padding: 16px; }

.create-view h2 {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 20px;
  color: var(--text);
}

.photo-upload {
  border: 2px dashed var(--border);
  border-radius: var(--radius-md);
  padding: 24px;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
  transition: border-color 0.2s;
  margin-bottom: 16px;
}

.photo-upload:hover { border-color: var(--accent); }
.photo-upload .icon { font-size: 28px; margin-bottom: 6px; }
.photo-upload p { font-size: 13px; }

.location-input { display: flex; gap: 8px; }
.location-input .form-input { flex: 1; }

.loc-btn {
  padding: 11px 14px;
  border: 1.5px solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--accent-pale);
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'DM Sans', sans-serif;
  transition: background 0.2s;
}

.loc-btn:hover { background: var(--accent); color: white; }

/* ===== NEIGHBORHOOD PICKER ===== */
.location-bar { cursor: pointer; transition: opacity 0.2s; }
.location-bar:hover { opacity: 0.9; }

.sofia-map { width:100%; display:block; border-radius:var(--radius-sm); background:#eef2f7; }
.sofia-map path.district-bg { fill:#e8e0d8; stroke:#fff; stroke-width:0.8; }
.sofia-map path.park { fill:#4a9e47; stroke:#fff; stroke-width:0.3; opacity:0.6; pointer-events:none; }
.sofia-map path.quarter { stroke:#fff; stroke-width:0.5; cursor:pointer; transition:opacity 0.15s, stroke-width 0.15s, filter 0.15s; opacity:0.85; }
.sofia-map path.quarter:hover { opacity:1; stroke-width:1.5; stroke:#333; filter:brightness(1.15); }
.sofia-map path.quarter.selected { opacity:1; stroke:var(--primary); stroke-width:2.5; filter:brightness(1.2); }
.sofia-map-tooltip { position:absolute; background:rgba(30,41,59,0.92); color:#fff; padding:5px 12px; border-radius:8px; font-size:13px; font-weight:500; pointer-events:none; z-index:10; white-space:nowrap; transform:translate(-50%,-100%); margin-top:-10px; box-shadow:0 2px 8px rgba(0,0,0,0.2); }

.home-map-section {
  margin: 0 16px 12px;
  background: white;
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.home-map-section h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
#home-map-container { margin-bottom: 10px; border-radius: var(--radius-sm); overflow: hidden; background: #eef2f7; max-height: 300px; }
#home-map-container .sofia-map { max-height: 300px; }
#modal-map-container { margin-bottom: 12px; border-radius: var(--radius-sm); overflow: hidden; background: #eef2f7; max-height: 220px; }
#modal-map-container .sofia-map { max-height: 220px; }
.home-map-section .district-select {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  background: white;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
.home-map-section .district-select:focus { border-color: var(--accent); }
.home-map-selected-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.home-map-selected-tags:empty { display: none; }
.district-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  color: white;
  cursor: pointer;
}
.district-tag .tag-x { font-size: 14px; margin-left: 2px; opacity: 0.8; }
.district-tag:hover .tag-x { opacity: 1; }

.neighborhood-modal {
  max-height: 70vh;

  display: flex;

}

.neighborhood-modal .modal-body {
  overflow-y: auto;

}

.neighborhood-search {

}

.neighborhood-search input {
  width: 100%;

  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}

.neighborhood-search input:focus { border-color: var(--accent); }

.neighborhood-search .search-icon {
  position: absolute;
  left: 12px;

}

.district-group { margin-bottom: 4px; }

.district-header {
  display: flex;
  align-items: center;

}

.district-header:hover { background: var(--bg); }

.district-dot {

}

.district-name {

  color: var(--text);

}

.district-arrow {

.district-quarters {

.quarter-item {

}

.quarter-item label {

}

.neighborhood-actions {

}

.neighborhood-actions button {

  font-size: 14px;

}

.btn-clear {

}

.btn-clear:hover { border-color: var(--danger); color: var(--danger); }

.btn-apply {

}

.btn-apply:hover { background: var(--accent-light); }

.task-location-tag {

}

/* Payment method in create form */

}

}

.pay-method-card.active {

}

.pay-method-card .pm-icon { font-size: 24px; margin-bottom: 4px; }
.pay-method-card .pm-label { font-size: 12px; font-weight: 600; color: var(--text); }

.pay-method-card.disabled {

.coming-soon-tag {

/* ===== MY TASKS VIEW ===== */
.my-tasks-header { padding: 16px 16px 0; }

.my-tasks-header h2 {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 14px;
}

.tab-bar {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
}

.tab-btn {
  flex: 1;
  padding: 10px 0;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);

}

.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

.my-tasks-list {

}

.my-task-card {
  background: white;

  border: 1px solid var(--border);

}

.my-task-card:hover { box-shadow: var(--shadow-md); }

.my-task-top {

  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 6px;
}

.my-task-card h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
  margin-right: 8px;
}

.status-badge {

  font-weight: 700;

  border-radius: 6px;

  white-space: nowrap;
}

.status-badge.open { background: #dbeafe; color: #1e40af; }
.status-badge.selecting { background: #fef3c7; color: #92400e; }
.status-badge.in-progress { background: #d1fae5; color: #065f46; }
.status-badge.completed { background: #e0e7ff; color: #3730a3; }

.status-badge.not-selected { background: #fee2e2; color: #991b1b; }

.my-task-meta {

.mark-complete-btn {

/* ===== MESSAGES VIEW ===== */

  font-weight: 700;
}

}

.chat-time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; align-self: flex-start; margin-top: 2px; }

.unread-dot {

.locked-chat p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

.chat-view { display: none; flex-direction: column; height: calc(100vh - 128px); }

.chat-conv-header {

.chat-task-ref .task-title { font-size: 12px; font-weight: 600; color: var(--text); }

.chat-task-ref .task-price-sm {

.chat-input-bar {

.add-funds-btn {

  align-items: flex-start;
}

.escrow-info .info-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.escrow-info p { font-size: 12.5px; color: var(--primary); line-height: 1.5; }

.tx-section { padding: 0 16px 16px; }
.tx-section h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
.tx-list { display: flex; flex-direction: column; gap: 2px; }

.tx-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: white;
  border-radius: var(--radius-md);
}

.tx-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.tx-icon.deposit { background: #dbeafe; }
.tx-icon.held { background: #fef3c7; }
.tx-icon.released { background: #d1fae5; }
.tx-icon.received { background: #dbeafe; }

.tx-details { flex: 1; }
.tx-details .tx-title { font-size: 13px; font-weight: 600; color: var(--text); }
.tx-details .tx-date { font-size: 11px; color: var(--text-muted); }

.tx-amount { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 700; }
.tx-amount.positive { color: var(--success); }
.tx-amount.negative { color: var(--text); }
.tx-amount.pending-tx { color: var(--warning); }

.tx-status {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  text-align: right;
}

.tx-status.held-s { color: var(--warning); }
.tx-status.released-s { color: var(--success); }
.tx-status.received-s { color: var(--received); }

/* Cash mode wallet */
.cash-wallet-msg {
  margin: 16px;
  padding: 24px;
  text-align: center;
}

.cash-wallet-msg .cash-icon { font-size: 48px; margin-bottom: 12px; }
.cash-wallet-msg h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.cash-wallet-msg p { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; }

.cash-tips {
  text-align: left;
  margin: 0 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.cash-tip {
  background: white;
  border-radius: var(--radius-md);
  padding: 12px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  border: 1px solid var(--border);
}

.cash-tip .tip-icon { font-size: 18px; flex-shrink: 0; }
.cash-tip .tip-text { font-size: 12.5px; color: var(--text-secondary); line-height: 1.4; }
.cash-tip .tip-text strong { color: var(--text); }

/* Preview card */
.preview-card {
  background: var(--bg);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-top: 16px;
  border: 1px solid var(--border);
  display: none;
}

.preview-card.show { display: block; }

.preview-card h4 {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}

/* Countdown */
.countdown {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--danger);
}

.countdown.ok { color: var(--accent); }

.countdown .dot {
  width: 6px;
  height: 6px;
  border-radius: var(--radius-full);
  background: currentColor;
  animation: blink 1.5s infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.stars { color: var(--warning); letter-spacing: 1px; }

/* Profile view */
.profile-section { padding: 16px; }

.profile-card {
  background: white;
  border-radius: var(--radius-xl);
  padding: 24px 20px;
  text-align: center;
  border: 1px solid var(--border);
  margin-bottom: 16px;
}

.profile-card .profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: var(--radius-full);
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 26px;
  font-weight: 700;
  margin: 0 auto 12px;
  position: relative;
}

.profile-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.profile-card .member-since { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

.trust-summary {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 12px 0;
  border-top: 1px solid var(--border);
  margin-top: 12px;
}

.trust-stat { text-align: center; }
.trust-stat .stat-value { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; color: var(--primary); }
.trust-stat .stat-label { font-size: 11px; color: var(--text-muted); }

.trust-progress-card {
  background: white;
  border-radius: var(--radius-md);
  padding: 16px;
  border: 1px solid var(--border);
  margin-bottom: 12px;
}

.trust-progress-card h4 {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.progress-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
}

.progress-item .check {
  width: 22px;
  height: 22px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  flex-shrink: 0;
}

.progress-item .check.done { background: var(--accent-pale); color: var(--accent); }
.progress-item .check.pending { background: var(--bg); color: var(--text-muted); border: 1.5px solid var(--border); }

.progress-item .prog-text { font-size: 13px; color: var(--text); }
.progress-item .prog-text.completed { color: var(--text-muted); text-decoration: line-through; }

.mt-12 { margin-top: 12px; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state .icon { font-size: 40px; margin-bottom: 10px; }
.empty-state p { font-size: 13px; }

/* ===== AUTH VIEW ===== */
.auth-screen {
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}

.auth-screen .auth-logo {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}

.auth-screen .auth-logo span { color: var(--accent); }

.auth-screen .auth-subtitle {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 28px;
}

.auth-card {
  width: 100%;
  max-width: 380px;
  background: white;
  border-radius: var(--radius-xl);
  padding: 24px 20px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}

.auth-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 20px;
  border-bottom: 2px solid var(--border);
}

.auth-tab {
  flex: 1;
  padding: 10px 0;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}

.auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

.auth-form { display: none; }
.auth-form.active { display: block; }

.auth-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0;
  color: var(--text-muted);
  font-size: 12px;
}

.auth-divider::before, .auth-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.btn-google {
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-md);
  background: white;
  color: var(--text);
  border: 1.5px solid var(--border);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.btn-google:hover { border-color: var(--text-muted); box-shadow: var(--shadow-sm); }

.btn-facebook {
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-md);
  background: #1877F2;
  color: white;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 0.2s;
}
.btn-facebook:hover { background: #166FE5; }

.social-btns { display: flex; flex-direction: column; gap: 10px; }

.auth-error {
  background: #fef2f2;
  color: var(--danger);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}

.auth-error.show { display: block; }

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.signout-btn {
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-md);
  background: white;
  color: var(--danger);
  border: 1.5px solid var(--border);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
  transition: background 0.2s;
}

.signout-btn:hover { background: #fef2f2; }

.loading-spinner {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

/* Desktop sidebar - hidden by default */
.desktop-sidebar {
  display: none;
}

/* ===== RESPONSIVE BREAKPOINTS ===== */

/* Tablet (768px+) */
@media (min-width: 768px) {
  .app-frame {
    max-width: 720px;
    margin: 0 auto;
  }

  .tasks-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  .my-tasks-list {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .categories-scroll {
    flex-wrap: wrap;
    overflow-x: visible;
  }

  .cat-chip {
    flex-shrink: 0;
  }

  .detail-info-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .modal {
    max-width: 520px;
    margin: 0 auto;
    border-radius: var(--radius-xl);
  }

  .modal-overlay {
    align-items: center;
  }

  .create-view {
    max-width: 600px;
    margin: 0 auto;
  }

  .auth-card {
    max-width: 420px;
  }

  .ad-banner {
    margin: 8px 0;
  }
}

/* Desktop (1024px+) */
@media (min-width: 1024px) {
  body {
    background: #f1f5f9;
  }

  .app-frame {
    max-width: 1200px;
    margin: 0 auto;
    overflow: visible;
  }

  #app.app-visible {
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: 56px 1fr;
  }

  .app-header {
    position: sticky;
    top: 0;
    left: auto;
    right: auto;
    grid-column: 1 / -1;
    padding: 12px 24px;
  }

  .desktop-sidebar {
    display: flex;
    flex-direction: column;
    background: white;
    border-right: 1px solid var(--border);
    padding: 16px 0;
    position: sticky;
    top: 56px;
    height: calc(100vh - 56px);
    overflow-y: auto;
  }

  .sidebar-nav {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 8px;
  }

  .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    transition: all 0.15s;
    border: none;
    background: none;
    font-family: 'DM Sans', sans-serif;
    width: 100%;
    text-align: left;
  }

  .sidebar-nav-item:hover {
    background: var(--bg);
    color: var(--text);
  }

  .sidebar-nav-item.active {
    background: var(--accent-pale);
    color: var(--accent);
    font-weight: 600;
  }

  .sidebar-nav-item .sidebar-icon {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .sidebar-nav-item .sidebar-icon svg {
    width: 20px;
    height: 20px;
  }

  .sidebar-nav-item.create-sidebar-btn {
    background: var(--accent);
    color: white;
    font-weight: 600;
    margin: 8px 8px 0;
    width: calc(100% - 16px);
    justify-content: center;
    border-radius: var(--radius-md);
  }

  .sidebar-nav-item.create-sidebar-btn:hover {
    background: var(--accent-light);
    color: white;
  }

  .app-content {
    padding-top: 0;
    padding-bottom: 0;
    min-height: calc(100vh - 56px);
  }

  .bottom-nav {
    display: none;
  }

  .tasks-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 0 24px 24px;
  }

  .my-tasks-list {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 14px;
    padding: 16px 24px;
  }

  .categories-scroll {
    padding: 20px 24px 8px;
    flex-wrap: wrap;
    overflow-x: visible;
    gap: 10px;
  }

  .home-map-section {
    margin: 0 24px 16px;
  }

  .search-section {
    padding: 16px 24px;
    padding-top: 8px;
    padding-bottom: 20px;
  }

  .sort-bar {
    padding: 4px 24px 8px;
  }

  .detail-info-grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .detail-header {
    padding: 20px 24px;
  }

  .detail-body {
    padding: 20px 24px;
    max-width: 800px;
  }

  .bids-section {
    padding: 0 24px 24px;
    max-width: 800px;
  }

  .create-view {
    max-width: 700px;
    margin: 0 auto;
    padding: 24px;
  }

  .modal {
    max-width: 520px;
    border-radius: var(--radius-xl);
  }

  .modal-overlay {
    align-items: center;
  }

  .profile-section {
    max-width: 700px;
    margin: 0 auto;
    padding: 24px;
  }

  .wallet-header-card {
    margin: 24px;
  }

  .add-funds-btn {
    margin: 0 24px 16px;
    width: calc(100% - 48px);
  }

  .tx-section {
    padding: 0 24px 24px;
  }

  .escrow-info {
    margin: 0 24px 16px;
  }

  .cash-wallet-msg {
    margin: 24px;
  }

  .cash-tips {
    margin: 0 24px 16px;
  }

  .my-tasks-header {
    padding: 16px 24px 0;
  }

  .messages-header {
    padding: 16px 24px;
  }

  .chat-list {
    padding: 0 24px;
  }

  /* Chat split screen */
  #view-messages.active {
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: calc(100vh - 56px);
  }

  #view-messages #messages-list-view {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    max-height: calc(100vh - 56px);
  }

  #view-messages .chat-view {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 56px);
  }

  #view-messages .chat-view:not(.active) {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #view-messages #messages-list-view { display: block !important; }

  #view-messages .chat-view:not(.active)::after {
    content: attr(data-empty);
    color: var(--text-muted);
    font-size: 16px;
  }

  .place-bid-sticky {
    left: calc(240px + 50%);
    transform: translateX(-50%);
  }

  .payment-mode-bar {
    margin: 12px 24px;
  }
}

/* Large Desktop (1440px+) */
@media (min-width: 1440px) {
  .app-frame {
    max-width: 1400px;
  }

  .tasks-grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }

  .my-tasks-list {
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 16px;
  }

  .create-view {
    max-width: 800px;
  }

  .detail-body {
    max-width: 900px;
  }

  .bids-section {
    max-width: 900px;
  }
}

/* ===== NOTIFICATIONS ===== */
.notif-wrap { position: relative; }
.notif-panel {
  display: none;
  position: absolute;
  right: 0;
  top: calc(100% + 10px);
  width: min(360px, calc(100vw - 32px));
  max-height: 70vh;
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  z-index: 250;
}
.notif-panel.open { display: block; }
.notif-panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.notif-panel-head button {
  background: none;
  border: none;
  color: var(--accent);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.notif-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  border: none;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
}
.notif-item:hover { background: var(--bg-warm); }
.notif-item.unread { background: #f0fdfa; }
.notif-item .n-text { font-size: 13px; color: var(--text); line-height: 1.4; }
.notif-item .n-time { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.notif-empty { padding: 24px 14px; text-align: center; color: var(--text-muted); font-size: 13px; }

/* ===== PHOTOS ===== */
.photo-thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.photo-thumb {
  position: relative;
  width: 72px;
  height: 72px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-thumb button {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 22px;
  height: 22px;
  border-radius: var(--radius-full);
  border: none;
  background: rgba(15,36,64,0.7);
  color: white;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}
.task-thumb {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  display: block;
}
.detail-photos {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 8px;
  margin: 12px 0;
}
.detail-photos img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: var(--radius-md);
  display: block;
}

/* ===== TASK ACTIONS ===== */
.detail-actions { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.detail-actions .btn-primary, .detail-actions .btn-secondary { margin: 0; }
.btn-danger-outline {
  width: 100%;
  padding: 12px;
  background: none;
  border: 1.5px solid var(--danger);
  border-radius: var(--radius-md);
  color: var(--danger);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-danger-outline[data-armed] { background: var(--danger); color: white; }
.status-banner {
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: #fef3c7;
  color: #92400e;
  font-size: 13px;
  line-height: 1.4;
  margin: 12px 0;
}
.mini-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.mini-btn {
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--card);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
}
.mini-btn.accent { border-color: var(--accent); color: var(--accent); }
.mini-btn[data-armed] { border-color: var(--danger); color: var(--danger); }
.rated-label { font-size: 12px; color: var(--warning); font-weight: 600; }

/* ===== RATING ===== */
.star-input { display: flex; gap: 6px; justify-content: center; margin: 8px 0 16px; }
.star-input button {
  font-size: 34px;
  line-height: 1;
  background: none;
  border: none;
  padding: 2px;
  color: var(--border);
  cursor: pointer;
}
.star-input button.on { color: var(--warning); }

/* ===== WALLET (demo) ===== */
.test-credits-note {
  margin: 0 16px 12px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  background: #fef3c7;
  color: #92400e;
  font-size: 12.5px;
  font-weight: 600;
  text-align: center;
}
.topup-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.topup-grid button {
  padding: 14px 0;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border);
  background: var(--card);
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--primary);
  cursor: pointer;
}
.topup-grid button:hover { border-color: var(--accent); color: var(--accent); }
.topup-grid button:disabled { opacity: 0.5; cursor: default; }

/* ===== REVIEWS ===== */
.reviews-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin: 12px 0;
  box-shadow: var(--shadow-sm);
}
.reviews-card h4 { font-size: 14px; margin-bottom: 8px; color: var(--text); }
.review-item { padding: 10px 0; border-top: 1px solid var(--border); }
.review-item:first-of-type { border-top: none; }
.review-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text); }
.review-item p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }
.reviews-empty { font-size: 13px; color: var(--text-muted); }
label.photo-upload { display: block; }

.sidebar-badge {
  margin-left: auto;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--danger);
  color: white;
  font-size: 10px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* On phones the bell isn't at the screen edge, so pin the panel to the viewport. */
@media (max-width: 1023px) {
  .notif-panel { position: fixed; top: 64px; left: 16px; right: 16px; width: auto; }
}

#toast { white-space: normal !important; max-width: min(92vw, 440px); text-align: center; }
</style>
</head>
<body>

<!-- AUTH MODAL (on-demand overlay — not a full-page gate) -->
<div class="auth-modal-overlay" id="auth-screen-wrapper">
  <div class="auth-screen" style="min-height:unset;width:100%;max-width:420px;border-radius:var(--radius-xl);position:relative;padding:28px 20px 32px;">
    <button class="auth-modal-close" onclick="closeAuthModal()" aria-label="Затвори" data-i18n="close" data-i18n-attr="aria-label">✕</button>
    <div class="auth-logo">Quick<span>Task</span></div>
    <p class="auth-subtitle" data-i18n="auth_subtitle">Свърши нещата наблизо</p>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('login')" data-i18n="login">Вход</button>
        <button class="auth-tab" onclick="switchAuthTab('signup')" data-i18n="register">Регистрация</button>
      </div>
      <div class="auth-error" id="auth-error"></div>

      <!-- LOGIN FORM -->
      <div class="auth-form active" id="form-login">
        <div class="form-group">
          <label data-i18n="email">Имейл</label>
          <input class="form-input" id="login-email" type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label data-i18n="password">Парола</label>
          <input class="form-input" id="login-password" type="password" placeholder="Вашата парола" data-i18n="password_ph" data-i18n-attr="placeholder">
        </div>
        <button class="btn-primary" id="btn-login" onclick="handleLogin()" data-i18n="login">Вход</button>
        <div class="auth-divider oauth-only" data-i18n="or">или</div>
        <div class="social-btns oauth-only">
          <button class="btn-google" onclick="handleGoogleAuth()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            <span data-i18n="continue_google">Продължи с Google</span>
          </button>
          <button class="btn-facebook" onclick="handleFacebookAuth()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            <span data-i18n="continue_facebook">Продължи с Facebook</span>
          </button>
        </div>
      </div>

      <!-- SIGNUP FORM -->
      <div class="auth-form" id="form-signup">
        <div class="form-group">
          <label data-i18n="name">Име и фамилия</label>
          <input class="form-input" id="signup-name" type="text" placeholder="Мария Петрова" data-i18n="name_ph" data-i18n-attr="placeholder">
        </div>
        <div class="form-group">
          <label data-i18n="username">Потребителско име</label>
          <input class="form-input" id="signup-username" type="text" placeholder="maria_p">
        </div>
        <div class="form-group">
          <label data-i18n="email">Имейл</label>
          <input class="form-input" id="signup-email" type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label data-i18n="password">Парола</label>
          <input class="form-input" id="signup-password" type="password" placeholder="Минимум 6 символа" data-i18n="password_min_ph" data-i18n-attr="placeholder">
        </div>
        <button class="btn-primary" id="btn-signup" onclick="handleSignup()" data-i18n="signup">Създай акаунт</button>
        <div class="auth-divider oauth-only" data-i18n="or">или</div>
        <div class="social-btns oauth-only">
          <button class="btn-google" onclick="handleGoogleAuth()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            <span data-i18n="continue_google">Продължи с Google</span>
          </button>
          <button class="btn-facebook" onclick="handleFacebookAuth()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            <span data-i18n="continue_facebook">Продължи с Facebook</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="app-frame app-visible" id="app">
  <!-- Header -->
  <header class="app-header">
    <div class="logo">Quick<span>Task</span></div>
    <div class="header-right" id="header-right">
      <button id="lang-toggle" onclick="switchLang()" class="lang-toggle-btn">EN</button>
      <!-- Shown when logged out (default until session resolves) -->
      <div class="header-auth-btns" id="header-auth-btns">
        <button class="btn-header-login" onclick="showAuthModal(); switchAuthTab('login')" data-i18n="login">Вход</button>
        <button class="btn-header-signup" onclick="showAuthModal(); switchAuthTab('signup')" data-i18n="register">Регистрация</button>
      </div>
      <!-- Shown when logged in -->
      <div id="header-user-btns" style="display:none;align-items:center;gap:8px;">
        <div class="notif-wrap">
          <button class="notif-btn" id="notif-btn" onclick="toggleNotifications(event)" aria-label="Известия" data-i18n="notifications" data-i18n-attr="aria-label">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            <span class="notif-badge" id="notif-badge" style="display:none"></span>
          </button>
          <div class="notif-panel" id="notif-panel"></div>
        </div>
        <div class="profile-avatar-sm" onclick="showView('profile')">?</div>
      </div>
    </div>
  </header>

  <!-- Desktop Sidebar -->
  <aside class="desktop-sidebar">
    <nav class="sidebar-nav">
      <button class="sidebar-nav-item active" onclick="showView('home')">
        <span class="sidebar-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span data-i18n="nav_home">Начало</span>
      </button>
      <button class="sidebar-nav-item" onclick="showView('mytasks')">
        <span class="sidebar-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></span>
        <span data-i18n="nav_mytasks">Моите задачи</span>
      </button>
      <button class="sidebar-nav-item" onclick="showView('messages')">
        <span class="sidebar-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span>
        <span data-i18n="nav_messages">Съобщения</span>
        <span class="sidebar-badge" id="msg-badge-side" style="display:none"></span>
      </button>
      <button class="sidebar-nav-item" onclick="showView('wallet')">
        <span class="sidebar-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><path d="M1 10h22"/></svg></span>
        <span data-i18n="nav_wallet">Портфейл</span>
      </button>
      <button class="sidebar-nav-item create-sidebar-btn" onclick="showView('create')">
        <span class="sidebar-icon">+</span>
        <span data-i18n="create_title">Публикувай задача</span>
      </button>
    </nav>
  </aside>

  <main class="app-content">
    <!-- HOME VIEW -->
    <div class="view active" id="view-home">
      <div class="search-section">
        <div class="location-bar" onclick="openNeighborhoodPicker()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>
          <span id="location-bar-text">София · Всички квартали</span>
        </div>
        <div class="search-bar">
          <svg width="18" height="18" fill="none" stroke="#94a3b8" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="search-keyword" placeholder="Търси задачи... (напр. монтаж)" data-i18n="search_placeholder" data-i18n-attr="placeholder" oninput="renderTaskCards()">
        </div>
        <div class="search-filters">
          <select class="filter-select" id="filter-time" onchange="renderTaskCards()">
            <option value="" data-i18n="any_time">Всяко време</option>
            <option value="1" data-i18n="within_1h">До 1 час</option>
            <option value="3" data-i18n="within_3h">До 3 часа</option>
            <option value="6" data-i18n="within_6h">До 6 часа</option>
            <option value="12" data-i18n="within_12h">До 12 часа</option>
            <option value="24" data-i18n="within_24h">До 24 часа</option>
          </select>
        </div>
      </div>

      <div class="categories-scroll">
        <button class="cat-chip active" data-cat="all">All</button>
        <button class="cat-chip" data-cat="home-repair">Home Repair</button>
        <button class="cat-chip" data-cat="cleaning">Cleaning</button>
        <button class="cat-chip" data-cat="delivery">Delivery</button>
        <button class="cat-chip" data-cat="errands">Errands</button>
        <button class="cat-chip" data-cat="moving">Moving</button>
        <button class="cat-chip" data-cat="tech-help">Tech Help</button>
        <button class="cat-chip" data-cat="plumbing">Plumbing</button>
        <button class="cat-chip" data-cat="electrical">Electrical</button>
        <button class="cat-chip" data-cat="painting">Painting</button>
        <button class="cat-chip" data-cat="gardening">Gardening</button>
        <button class="cat-chip" data-cat="pet-care">Pet Care</button>
        <button class="cat-chip" data-cat="tutoring">Tutoring</button>
        <button class="cat-chip" data-cat="beauty">Beauty & Wellness</button>
        <button class="cat-chip" data-cat="other">Other</button>
      </div>

      <div class="home-map-section" id="home-map-section">
        <h4 data-i18n="search_by_district">📍 Търси по район</h4>
        <div id="home-map-container" style="position:relative"></div>
        <select class="district-select" id="home-district-select" onchange="selectDistrictFromDropdown(this.value)">
          <option value="">Всички райони — изберете район</option>
        </select>
        <div class="home-map-selected-tags" id="home-selected-tags"></div>
      </div>

      <div class="sort-bar">
        <span id="task-count"></span>
        <select class="sort-select" id="sort-tasks">
          <option value="newest" data-i18n="sort_newest">Най-нови</option>
          <option value="ending" data-i18n="sort_ending">Изтичащи скоро</option>
          <option value="price_low" data-i18n="sort_price_low">Цена: ниска към висока</option>
          <option value="price_high" data-i18n="sort_price_high">Цена: висока към ниска</option>
        </select>
      </div>

      <div class="tasks-grid" id="tasks-grid"></div>
    </div>

    <!-- TASK DETAIL VIEW -->
    <div class="view" id="view-detail">
      <div class="detail-header">
        <button class="back-btn" onclick="showView(lastListView)">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span data-i18n="nav_back">Назад</span>
        </button>
        <div id="detail-content"></div>
      </div>
      <div class="detail-body" id="detail-body"></div>
      <div class="bids-section" id="bids-section"></div>
      <div class="place-bid-sticky" id="bid-sticky" style="display:none">
        <button class="place-bid-btn" onclick="openBidModal()" data-i18n="place_bid">Направи оферта</button>
      </div>
    </div>

    <!-- CREATE TASK VIEW -->
    <div class="view" id="view-create" style="position:relative;">
      <!-- Guest overlay: captures all interaction and shows auth modal -->
      <div id="create-guest-overlay" onclick="requireAuth(() => showView('create'))" style="display:none;position:absolute;inset:0;z-index:5;cursor:pointer;"></div>
      <div class="create-view">
        <h2 data-i18n="create_title">Публикувай задача</h2>
        <div class="form-group">
          <label for="create-title" data-i18n="what_need">Какво трябва да се свърши?</label>
          <input class="form-input" id="create-title" type="text" maxlength="120" data-i18n="title_ph" data-i18n-attr="placeholder">
        </div>
        <div class="form-group">
          <label for="create-desc" data-i18n="description">Описание</label>
          <textarea class="form-textarea" id="create-desc" maxlength="4000" data-i18n="create_desc" data-i18n-attr="placeholder"></textarea>
        </div>
        <div class="form-group">
          <label for="create-cat" data-i18n="category">Категория</label>
          <select class="form-select" id="create-cat"></select>
        </div>
        <div class="form-group">
          <label data-i18n="photos_label">Снимки (по желание, до 5)</label>
          <label class="photo-upload" for="create-photos">
            <div class="icon">📷</div>
            <p data-i18n="add_photos">Натиснете за добавяне на снимки</p>
          </label>
          <input id="create-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="onPhotosPicked(this)">
          <div class="photo-thumbs" id="photo-thumbs"></div>
        </div>
        <div class="form-group">
          <label data-i18n="bidding_type">Тип наддаване</label>
          <div class="toggle-group">
            <button class="toggle-opt active" onclick="toggleBidType(this, 'price')" data-i18n="let_bidders">Изпълнителите предлагат цена</button>
            <button class="toggle-opt" onclick="toggleBidType(this, 'fixed')" data-i18n="fixed_only">Само фиксирана цена</button>
          </div>
        </div>
        <div class="form-group">
          <label for="create-price" id="price-label" data-i18n="suggested_budget">Ориентировъчен бюджет (€)</label>
          <input class="form-input" id="create-price" type="number" min="1" max="100000" step="1" placeholder="15">
        </div>
        <div class="form-group">
          <label data-i18n="payment_method">Начин на плащане</label>
          <div class="payment-method-cards">
            <div class="pay-method-card active" onclick="selectPayMethod(this,'cash')">
              <div class="pm-icon">💵</div>
              <div class="pm-label" data-i18n="pay_cash">В брой</div>
              <div class="pm-desc" data-i18n="pay_cash_desc">Плащане на място</div>
            </div>
            <div class="pay-method-card" onclick="selectPayMethod(this,'escrow')">
              <div class="pm-icon">🔒</div>
              <div class="pm-label" data-i18n="pay_escrow">Ескроу</div>
              <div class="pm-desc" data-i18n="pay_escrow_desc">Тестови кредити</div>
            </div>
          </div>
        </div>
        <div class="row-2">
          <div class="form-group">
            <label for="create-duration" data-i18n="bidding_duration">Продължителност</label>
            <select class="form-select" id="create-duration">
              <option value="1" data-i18n="hours_1">1 час</option>
              <option value="3" data-i18n="hours_3">3 часа</option>
              <option value="6" data-i18n="hours_6" selected>6 часа</option>
              <option value="12" data-i18n="hours_12">12 часа</option>
              <option value="24" data-i18n="hours_24">24 часа</option>
            </select>
          </div>
          <div class="form-group">
            <label for="create-selection" data-i18n="selection_time">Време за избор</label>
            <select class="form-select" id="create-selection">
              <option value="1" data-i18n="hours_1">1 час</option>
              <option value="3" data-i18n="hours_3" selected>3 часа</option>
              <option value="6" data-i18n="hours_6">6 часа</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="create-neighborhood" data-i18n="location">Квартал</label>
          <select class="form-select" id="create-neighborhood"></select>
        </div>
        <div class="form-group">
          <label for="create-address" data-i18n="address">Адрес (по желание)</label>
          <input class="form-input" id="create-address" type="text" data-i18n="address_ph" data-i18n-attr="placeholder">
        </div>
        <button class="btn-primary mt-12" onclick="previewTask()" data-i18n="preview">Преглед и публикуване</button>
        <div class="preview-card" id="preview-card">
          <h4 data-i18n="preview_title">Преглед</h4>
          <div id="preview-content"></div>
          <div style="display:flex;gap:8px;margin-top:14px">
            <button class="btn-secondary" style="flex:1" onclick="document.getElementById('preview-card').classList.remove('show')" data-i18n="edit_button">Редактирай</button>
            <button class="btn-primary" style="flex:1" id="btn-post-task" onclick="postTask()" data-i18n="post_button">Публикувай</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MY TASKS VIEW -->
    <div class="view" id="view-mytasks">
      <div class="my-tasks-header">
        <h2 data-i18n="nav_mytasks">Моите задачи</h2>
        <div class="tab-bar">
          <button class="tab-btn active" onclick="switchMyTab(this, 'posted')" data-i18n="posted_tab">Публикувани</button>
          <button class="tab-btn" onclick="switchMyTab(this, 'bidding')" data-i18n="bidding_tab">Моите оферти</button>
        </div>

function t(key) {
  return (STRINGS[currentLang] && STRINGS[currentLang][key]) || STRINGS['bg'][key] || key;
}

// Fill {placeholders} in a translated string.
function fill(template, vars) {
  return template.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ''));
}

function hasString(key) {
  return Boolean(STRINGS[currentLang]?.[key] || STRINGS.bg[key]);
}

// The database raises short keys ('insufficient_funds', 'own_task', ...);
// show the translated text, or the raw message for anything unexpected.
function errMsg(error) {
  const raw = String(error?.message || '').trim();
  if (hasString('err_' + raw)) return t('err_' + raw);
  return raw || t('err_generic');
}

// "1 bid" / "3 bids" (and the Bulgarian equivalents).
function countLabel(n, one, many) {
  return `${n} ${Number(n) === 1 ? t(one) : t(many)}`;
}

function locale() {
  return currentLang === 'bg' ? 'bg-BG' : 'en-GB';
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function getCAT(slug) {
  return (CAT_LABELS[currentLang] && CAT_LABELS[currentLang][slug]) || (CAT_LABELS['bg'] && CAT_LABELS['bg'][slug]) || slug;
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const attr = el.getAttribute('data-i18n-attr');
    if (attr) {
      el.setAttribute(attr, t(key));
    } else {
      el.textContent = t(key);
    }
  });
  document.documentElement.lang = currentLang;
  document.title = t('page_title');
  document.querySelectorAll('.cat-chip').forEach(chip => {
    const slug = chip.dataset.cat;
    if (!slug) return;
    chip.textContent = slug === 'all' ? t('cat_all') : getCAT(slug);
  });
  populateCategorySelect();
  populateNeighborhoodSelect();
  populateHomeDistrictSelect();
  updateLocationBarText();
  document.getElementById('price-label').textContent = createBidType === 'fixed' ? t('price') : t('suggested_budget');
}

function switchLang() {
  currentLang = currentLang === 'bg' ? 'en' : 'bg';
  localStorage.setItem('qt_lang', currentLang);
  document.getElementById('lang-toggle').textContent = currentLang === 'bg' ? 'EN' : 'BG';
  applyTranslations();
  if (document.getElementById('notif-panel').classList.contains('open')) renderNotifications();
  if (document.getElementById('preview-card').classList.contains('show')) previewTask();
  // Re-render current active view
  const activeView = document.querySelector('.view.active');
  if (activeView) {
    const name = activeView.id.replace('view-', '');
    if (name === 'home') renderTaskCards();
    else if (name === 'detail' && currentTask) openTask(currentTask.id);
    else if (name === 'mytasks') renderMyTasks();
    else if (name === 'messages') {
      renderChats(); // the list stays visible next to an open chat on desktop
      if (currentConvId) openChat(currentConvId);
    }
    else if (name === 'wallet') renderWallet();
    else if (name === 'profile') renderProfile();
  }
}

// ===== AUTH =====
function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  if(tab === 'login') {
    document.querySelectorAll('.auth-tab')[0].classList.add('active');
    document.getElementById('form-login').classList.add('active');
  } else {
    document.querySelectorAll('.auth-tab')[1].classList.add('active');
    document.getElementById('form-signup').classList.add('active');
  }
  document.getElementById('auth-error').classList.remove('show');
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.classList.toggle('show', Boolean(msg));
}

function withTimeout(promise) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(t('timeout'))), 10000))
  ]);
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if(!email || !password) return showAuthError(t('fill_all_auth'));
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = t('logging_in');
  try {
    const { error } = await withTimeout(sb.auth.signInWithPassword({ email, password }));
    if(error) showAuthError(error.message);
  } catch(e) {
    showAuthError(e.message || t('login_failed'));
  } finally {
    btn.disabled = false;
    btn.textContent = t('login');
  }
}

async function handleSignup() {
  const name = document.getElementById('signup-name').value.trim();
  const username = document.getElementById('signup-username').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  if(!name || !username || !email || !password) return showAuthError(t('fill_all_auth'));
  if(password.length < 6) return showAuthError(t('min_password'));
  const btn = document.getElementById('btn-signup');
  btn.disabled = true;
  btn.textContent = t('creating');
  try {
    const { data, error } = await withTimeout(
      sb.auth.signUp({ email, password, options: { data: { full_name: name, username: username } } })
    );
    if(error) { showAuthError(error.message); return; }
    showAuthError('');
    // With email confirmation off, signUp returns a session and the user is already in.
    showToast(data?.session ? t('welcome') : t('account_created_check_email'));
  } catch(e) {
    showAuthError(e.message || t('signup_failed'));
  } finally {
    btn.disabled = false;
    btn.textContent = t('signup');
  }
}

async function handleGoogleAuth() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  });
  if(error) showAuthError(error.message);
}

async function handleFacebookAuth() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'facebook',
    options: { redirectTo: window.location.origin }
  });
  if(error) showAuthError(error.message);
}
